# The console is one origin: static files, /api and /mcp to the api, /collab
# (WebSocket) to the collab server. Coolify routes the public domain to port 80.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript text/css application/json application/wasm image/svg+xml;
  # The app's MAX_UPLOAD_BYTES default is 50 MB; leave room for multipart framing.
  client_max_body_size 64m;

  # Compose's embedded DNS: re-resolve api/collab so a restarted service is
  # picked up without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8787;
  set $collab http://collab:1234;

  # Only the editing socket is public; the collab control routes (flush,
  # replace, revoke) stay on the compose network.
  location = /collab/internal { return 404; }
  location ^~ /collab/internal/ { return 404; }

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /mcp {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /mcp/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location = /collab {
    rewrite ^ / break;
    proxy_pass $collab;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  location /collab/ {
    rewrite ^/collab/(.*)$ /$1 break;
    proxy_pass $collab;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # pdf.js loads its worker as an ES module. The distro MIME map has no .mjs,
  # so without this nginx answers application/octet-stream and the PDF viewer
  # falls back to "This file can't be previewed."
  location ~* \.mjs$ {
    default_type text/javascript;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The XLSX viewer fetches its WASM from a worker. Serve the right MIME type and
  # cache the fingerprinted file for a year, like the PDF viewer's .mjs worker.
  location ~* \.wasm$ {
    default_type application/wasm;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Vite fingerprints everything under /assets; cache it for a year.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The shell must be revalidated so a new deployment is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
