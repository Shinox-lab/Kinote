# Browser security headers for the console. Included at server level AND in
# every location that has its own add_header: nginx drops inherited add_header
# lines in any block that sets one. /gridcraft/ deliberately does not include
# this (it is framed by the console and sets its own sandbox policy).
#
# script-src 'self': no inline scripts (the theme script is /theme.js).
# 'wasm-unsafe-eval': the xlsx viewer's WebAssembly. style-src 'unsafe-inline':
# BlockNote and Excalidraw set inline styles. img-src without other hosts: an
# image on another site never loads by itself (tracking pixels, and content
# leaked through an image URL), so pasted remote images do not show.
# frame-src 'self': GridCraft only; Excalidraw's third-party embeds are off.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Only when the edge says the request came in over HTTPS ($kinote_hsts is
# empty otherwise, and nginx sends no header for an empty value).
add_header Strict-Transport-Security $kinote_hsts always;
