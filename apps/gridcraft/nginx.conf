# The GridCraft editor is served to an iframe with an opaque origin, so its
# static assets need explicit CORS. The wiki API does not get CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

  add_header Access-Control-Allow-Origin "*" always;
  add_header Cross-Origin-Resource-Policy "cross-origin" always;

  # The release's hashed JS/CSS/WASM assets never change under the same name.
  location ~* \.wasm$ {
    default_type application/wasm;
    try_files $uri =404;
    expires 1y;
  }
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    expires 1y;
  }

  # The shell must be revalidated so a new deployment is picked up.
  location = /index.html {
    expires -1;
  }

  # Do not turn a missing asset into the HTML shell.
  location / {
    try_files $uri $uri/ =404;
  }
}
