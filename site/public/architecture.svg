<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Kinote architecture: the browser reaches the web service, which forwards to the API, live editing and the spreadsheet editor; the API and live editing use Postgres; the worker uses Postgres, object storage, the file reader and the model providers.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8d857b"/>
    </marker>
    <style>
      .box { fill: #fcfbf9; stroke: #b9b0a4; stroke-width: 1.5; }
      .web { fill: #ece6fa; stroke: #6550c9; stroke-width: 2; }
      .dash { fill: #f5f2ed; stroke: #8d857b; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .t { font: 600 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #24211d; }
      .s { font: 400 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #6b645b; }
      .e { font: 500 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #8d857b; }
      .l { fill: none; stroke: #8d857b; stroke-width: 1.5; marker-end: url(#arr); }
      .ld { fill: none; stroke: #8d857b; stroke-width: 1.5; stroke-dasharray: 5 5; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- entry -->
  <rect class="box" x="20" y="40" width="170" height="64" rx="10"/>
  <text class="t" x="105" y="68" text-anchor="middle">Browser</text>
  <text class="s" x="105" y="88" text-anchor="middle">React + BlockNote</text>

  <rect class="dash" x="20" y="150" width="170" height="64" rx="10"/>
  <text class="t" x="105" y="178" text-anchor="middle">External AI agents</text>
  <text class="s" x="105" y="198" text-anchor="middle">MCP (In development)</text>

  <rect class="web" x="250" y="40" width="190" height="174" rx="10"/>
  <text class="t" x="345" y="70" text-anchor="middle">web</text>
  <text class="s" x="345" y="90" text-anchor="middle">nginx · the one public port</text>
  <text class="s" x="345" y="128" text-anchor="middle">/api</text>
  <text class="s" x="345" y="148" text-anchor="middle">/collab</text>
  <text class="s" x="345" y="168" text-anchor="middle">/gridcraft/</text>
  <text class="s" x="345" y="188" text-anchor="middle">/mcp</text>

  <path class="l" d="M190 72H248"/>
  <path class="ld" d="M190 182H248"/>

  <!-- services -->
  <rect class="box" x="500" y="40" width="170" height="64" rx="10"/>
  <text class="t" x="585" y="68" text-anchor="middle">api</text>
  <text class="s" x="585" y="88" text-anchor="middle">REST · Fastify</text>

  <rect class="box" x="500" y="130" width="170" height="64" rx="10"/>
  <text class="t" x="585" y="158" text-anchor="middle">collab</text>
  <text class="s" x="585" y="178" text-anchor="middle">live editing · Yjs</text>

  <rect class="box" x="500" y="220" width="170" height="64" rx="10"/>
  <text class="t" x="585" y="248" text-anchor="middle">gridcraft</text>
  <text class="s" x="585" y="268" text-anchor="middle">spreadsheet editor</text>

  <path class="l" d="M440 72H498"/>
  <path class="l" d="M440 162H498"/>
  <path class="l" d="M420 214V252H498"/>

  <!-- data -->
  <rect class="box" x="760" y="40" width="200" height="154" rx="10"/>
  <text class="t" x="860" y="96" text-anchor="middle">Postgres 17</text>
  <text class="s" x="860" y="118" text-anchor="middle">pgvector</text>
  <text class="s" x="860" y="138" text-anchor="middle">row-level security</text>
  <text class="s" x="860" y="158" text-anchor="middle">job queue</text>

  <rect class="box" x="760" y="250" width="200" height="64" rx="10"/>
  <text class="t" x="860" y="278" text-anchor="middle">Object storage</text>
  <text class="s" x="860" y="298" text-anchor="middle">MinIO or your S3</text>

  <path class="l" d="M670 64H758"/>
  <path class="l" d="M670 162H758"/>
  <path class="l" d="M670 84H690V270H758"/>

  <!-- background work -->
  <rect class="box" x="500" y="380" width="170" height="64" rx="10"/>
  <text class="t" x="585" y="408" text-anchor="middle">worker</text>
  <text class="s" x="585" y="428" text-anchor="middle">index · read files · route</text>

  <rect class="box" x="760" y="380" width="200" height="64" rx="10"/>
  <text class="t" x="860" y="408" text-anchor="middle">extractor</text>
  <text class="s" x="860" y="428" text-anchor="middle">Docling · reads files</text>

  <rect class="dash" x="250" y="380" width="190" height="64" rx="10"/>
  <text class="t" x="345" y="408" text-anchor="middle">Model providers</text>
  <text class="s" x="345" y="428" text-anchor="middle">any OpenAI-compatible</text>

  <path class="l" d="M670 420H758"/>
  <path class="l" d="M500 412H442"/>
  <path class="l" d="M670 390H712V176H758"/>
  <path class="l" d="M670 400H736V300H758"/>
  <path class="ld" d="M500 96H470V380"/>

  <text class="e" x="456" y="372" text-anchor="end">Ask</text>
  <text class="e" x="20" y="490">Solid boxes run in Docker Compose. Dashed ones are outside it, or in development.</text>
</svg>
