# The whole Living Wiki app: the console (nginx), api, collab, worker, the
# Docling extractor, Postgres 17 + pgvector and MinIO.
#
#   docker compose up -d          # the app on http://localhost:8080 (WEB_HOST_PORT)
#
# This is also the Coolify deployment (a Docker Compose resource): see
# docs/operations.md. Only the web service needs a public domain (container
# port 80); every other published port is bound to 127.0.0.1 for local tools and
# tests. Secrets have no defaults: put them in an untracked .env (see
# .env.example) or in Coolify's Environment Variables.
#
# The first build includes the Docling extractor (several GB, ~2 GB RAM while it
# reads a file). Data lives in the named volumes below and survives restart,
# stop/start and a plain `docker compose down`; only `down -v` deletes it.
name: living-wiki

x-app-env: &app-env
  DATABASE_URL: postgres://living_wiki_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/living_wiki
  COLLAB_TOKEN_SECRET: ${COLLAB_TOKEN_SECRET:?set COLLAB_TOKEN_SECRET}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
  COLLAB_INTERNAL_URL: http://collab:1234
  API_PORT: "8787"
  COLLAB_PORT: "1234"
  HOST: 0.0.0.0
  # Coolify adds one proxy in front of the web nginx: set TRUST_PROXY=2 there.
  # Locally (web on :8080 with no edge proxy) leave it false; the rate limit uses
  # the nginx address. A single edge proxy in front is 1.
  TRUST_PROXY: ${TRUST_PROXY:-false}
  # `pnpm e2e` sets both (the suite signs up more accounts than 10 a minute).
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
  # MinIO is the bundled default; set S3_ENDPOINT to a vetted external store in
  # production (the minio service still runs but is unused by the app).
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-living-wiki}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_REGION: us-east-1
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-2000000}
  # The extractor is part of the stack; http is the default. `off` is a
  # deliberate text/CSV-only run, `fake` is for tests.
  EXTRACTOR_MODE: ${EXTRACTOR_MODE:-http}
  EXTRACTOR_URL: ${EXTRACTOR_URL:-http://extractor:8000}
  EXTRACTOR_TIMEOUT_MS: ${EXTRACTOR_TIMEOUT_MS:-240000}

services:
  postgres:
    # pgvector/pgvector:pg17 with infra/postgres/01-roles.sh copied into
    # /docker-entrypoint-initdb.d/ (see infra/postgres/Dockerfile).
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: living_wiki
      # Read by infra/postgres/01-roles.sh to create the living_wiki_app login.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Local/test access only. Coolify does not need these.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55543}:5432"
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary init server listens on
      # the socket only, so this passes once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d living_wiki"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  minio:
    # minio/minio is no longer published on Docker Hub; pgsty/minio is a
    # community build of the same server (same CLI, ports and env), for the
    # bundled stack only. Pinned by digest (the tag alone could be re-pushed).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      # The postgres superuser: RLS is forced on every table and the
      # SECURITY DEFINER functions run as the migration owner.
      DATABASE_MIGRATE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/living_wiki
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment: *app-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8787}:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/me').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  collab:
    build:
      context: .
      target: collab
    environment: *app-env
    ports:
      - "127.0.0.1:${COLLAB_HOST_PORT:-1234}:1234"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    networks: [default, extractor_net]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      extractor:
        condition: service_healthy
    restart: unless-stopped

  extractor:
    # Docling behind POST /extract. It shares an internal network with the
    # worker only: no internet, no database, no object storage.
    build:
      context: .
      dockerfile: apps/extractor/Dockerfile
      target: runtime
    environment:
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-2000000}
    networks: [extractor_net]
    restart: unless-stopped

  web:
    build:
      context: .
      target: web-runtime
    # Coolify generates the public domain for this service on container port 80.
    environment:
      SERVICE_URL_WEB_80: /
    ports:
      # Local console only. Coolify routes the domain to container port 80; it
      # does not need this host mapping.
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
      collab:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  extractor_net:
    internal: true

volumes:
  pgdata:
  miniodata:
