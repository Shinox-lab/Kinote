# A release: pushing a tag vX.Y.Z builds every image once, pushes each to
# ghcr.io/shinox-lab/kinote-<image>:X.Y.Z with the version baked in
# (KINOTE_VERSION), then creates the GitHub release. A tag with a suffix
# (v0.2.0-rc.1) makes a pre-release, for checking this workflow; Kinote-SaaS only
# offers plain X.Y.Z releases. deploy/docker-compose.release.yml runs the images.
# The packages are private when first pushed: make each public once in the
# organisation's Packages settings (docs/operations.md, "Releases").
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: postgres, context: infra/postgres, file: infra/postgres/Dockerfile, target: '' }
          - { image: migrate, context: ., file: Dockerfile, target: migrate }
          - { image: api, context: ., file: Dockerfile, target: api }
          - { image: collab, context: ., file: Dockerfile, target: collab }
          - { image: worker, context: ., file: Dockerfile, target: worker }
          - { image: web, context: ., file: Dockerfile, target: web-runtime }
          - { image: extractor, context: ., file: apps/extractor/Dockerfile, target: runtime }
          - { image: gridcraft, context: apps/gridcraft, file: apps/gridcraft/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          build-args: KINOTE_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/shinox-lab/kinote-${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then pre=--prerelease; else pre=; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $pre
